<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — AI Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<style>
*{box-sizing:border-box;user-select:none;margin:0;padding:0}
:root{
  --win-bg:rgba(22,22,26,0.82);
  --dock-bg:rgba(30,30,34,0.45);
  --bar-bg:rgba(18,18,22,0.55);
  --accent:#6c5ce7;
  --accent2:#a29bfe;
  --green:#00b894;
  --orange:#fdcb6e;
  --red:#ff6b6b;
  --text:#e8e8ef;
  --dim:#8888a0;
  --border:rgba(255,255,255,0.08);
  --card:rgba(255,255,255,0.04);
  --font:'Outfit',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:var(--font);color:var(--text);cursor:default}
body{
  background:#0a0a12;
  background-image:
    radial-gradient(ellipse 80% 60% at 20% 80%,rgba(108,92,231,0.18) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%,rgba(0,184,148,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(162,155,254,0.06) 0%,transparent 50%);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Inline SVG icon helper */
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-fill svg{fill:currentColor;stroke:none}

/* Boot */
#boot{
  position:fixed;inset:0;background:#000;z-index:100000;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:opacity 0.8s ease;
}
#boot .apple{width:80px;height:80px;margin-bottom:40px}
.boot-bar{width:200px;height:6px;background:#333;border-radius:3px;overflow:hidden}
.boot-fill{height:100%;width:0;background:#fff;border-radius:3px;transition:width 2.8s ease-in-out}

#desktop{width:100%;height:100%;position:relative}
#wins{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#wins .win{pointer-events:auto}

/* Menu Bar */
#menubar{
  position:absolute;top:0;width:100%;height:28px;
  background:var(--bar-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  display:flex;justify-content:space-between;align-items:center;
  padding:0 16px;font-size:12.5px;font-weight:500;z-index:5000;
  border-bottom:1px solid var(--border);
}
.bar-l,.bar-r{display:flex;gap:14px;align-items:center}
.bar-item{padding:2px 6px;border-radius:4px;cursor:default;white-space:nowrap;display:flex;align-items:center;gap:5px}
.bar-item:hover{background:rgba(255,255,255,0.08)}
.bar-item .icon{font-size:13px}
#app-name{font-weight:700}
#clock{color:var(--dim)}

/* Dock */
#dock-wrap{position:absolute;bottom:8px;width:100%;display:flex;justify-content:center;z-index:6000}
#dock{
  background:var(--dock-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--border);height:70px;padding:5px 10px;border-radius:20px;
  display:flex;align-items:flex-end;gap:8px;box-shadow:0 10px 20px rgba(0,0,0,0.3);
}
.d-item{
  width:55px;height:55px;border-radius:12px;position:relative;cursor:pointer;
  transition:all 0.2s cubic-bezier(0.25,1,0.5,1);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.d-item:hover{transform:scale(1.2) translateY(-10px);margin:0 5px}
.d-item .d-dot{width:5px;height:5px;background:rgba(255,255,255,0.4);border-radius:50%;position:absolute;bottom:-8px;display:none}
.d-item.open .d-dot{display:block}
.d-sep{width:1px;height:40px;background:rgba(255,255,255,0.2);margin:0 5px;flex-shrink:0}
.d-tooltip{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,34,0.92);backdrop-filter:blur(12px);
  padding:4px 12px;border-radius:6px;font-size:11px;white-space:nowrap;
  opacity:0;transition:opacity 0.15s;pointer-events:none;border:1px solid var(--border);
}
.d-item:hover .d-tooltip{opacity:1}
.ico{width:100%;height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;overflow:hidden}
.ico svg{width:28px;height:28px}
.ico-home{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
.ico-feat{background:linear-gradient(135deg,#00b894,#55efc4)}
.ico-price{background:linear-gradient(135deg,#fdcb6e,#e17055)}
.ico-about{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.ico-demo{background:linear-gradient(135deg,#2d3436,#636e72);font-family:var(--mono);font-size:18px;font-weight:600}
.ico-contact{background:linear-gradient(135deg,#fd79a8,#e84393)}
.ico-twitter{background:#000}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.bouncing{animation:bounce 0.6s ease infinite}

/* Windows */
.win{
  position:absolute;background:var(--win-bg);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:12px;border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 15px 40px rgba(0,0,0,0.4);display:flex;flex-direction:column;
  overflow:visible;min-width:300px;min-height:200px;
  transition:transform 0.15s,opacity 0.15s,box-shadow 0.2s;
}
.win.opening{animation:wOpen 0.2s cubic-bezier(0.16,1,0.3,1)}
@keyframes wOpen{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.win.inactive{box-shadow:0 5px 15px rgba(0,0,0,0.2);border-color:rgba(255,255,255,0.05)}
.win.inactive .tl span{background-color:#555!important}
.win-head{
  height:30px;background:rgba(255,255,255,0.05);
  display:flex;align-items:center;position:relative;cursor:grab;flex-shrink:0;
}
.win-head:active{cursor:grabbing}
.tl{display:flex;gap:8px;margin-left:12px;z-index:2}
.tl span{width:12px;height:12px;border-radius:50%;cursor:default}
.tl .c{background:#ff5f56}.tl .m{background:#ffbd2e}.tl .x{background:#27c93f}
.win-title{position:absolute;width:100%;text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,0.8);pointer-events:none}
.win-body{flex:1;overflow:auto;position:relative;border-radius:0 0 12px 12px;background:rgba(0,0,0,0.15)}
.ui-resizable-se{bottom:0;right:0;width:15px;height:15px;background:none}

/* Context Menu */
#ctx{
  position:absolute;background:rgba(40,40,40,0.9);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 0;width:200px;
  display:none;z-index:99999;box-shadow:0 8px 20px rgba(0,0,0,0.3);font-size:13px;
}
.ctx-i{padding:6px 15px;cursor:default}
.ctx-i:hover{background:var(--accent);color:#fff}
.ctx-hr{border-top:1px solid rgba(255,255,255,0.1);margin:4px 0}

/* ═══ SECTION STYLES ═══ */

.s-home{padding:48px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:24px;min-height:100%}
.s-home .tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(108,92,231,0.15);border:1px solid rgba(108,92,231,0.25);
  padding:4px 14px;border-radius:100px;font-size:12px;color:var(--accent2);font-weight:500;
}
.s-home .tag .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,184,148,0.4)}50%{box-shadow:0 0 0 6px transparent}}
.s-home h1{font-size:clamp(32px,4vw,52px);font-weight:800;line-height:1.05;letter-spacing:-1.5px}
.s-home h1 em{font-style:italic;color:var(--accent2)}
.s-home p{font-size:16px;color:var(--dim);line-height:1.7;max-width:440px}
.s-home .btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-p{
  display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;
  border:none;cursor:pointer;font-family:var(--font);transition:all 0.2s;text-decoration:none;
}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(108,92,231,0.35)}
.btn-g{
  display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:10px;
  background:transparent;color:var(--dim);font-weight:600;font-size:14px;
  border:1px solid var(--border);cursor:pointer;font-family:var(--font);transition:all 0.2s;
}
.btn-g:hover{border-color:var(--dim);color:var(--text)}

.s-feat{padding:36px 32px}
.s-feat h2{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
.s-feat .sub{color:var(--dim);font-size:14px;margin-bottom:28px}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.feat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;transition:all 0.25s}
.feat-card:hover{border-color:rgba(108,92,231,0.3);transform:translateY(-2px)}
.feat-card .fi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px}
.feat-card .fi svg{width:20px;height:20px;stroke-width:2}
.feat-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.feat-card p{font-size:13px;color:var(--dim);line-height:1.6}

.s-price{padding:36px 32px}
.s-price h2{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
.s-price .sub{color:var(--dim);font-size:14px;margin-bottom:28px}
.price-row{display:flex;gap:16px}
.price-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;display:flex;flex-direction:column;position:relative;transition:all 0.25s}
.price-card.pop{border-color:var(--accent);box-shadow:0 0 40px rgba(108,92,231,0.15)}
.price-card.pop::before{content:'POPULAR';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 12px;border-radius:5px}
.price-card .tier{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
.price-card .amt{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.price-card .amt span{font-size:14px;color:var(--dim);font-weight:400}
.price-card .desc{font-size:12.5px;color:var(--dim);margin-bottom:20px}
.price-card ul{list-style:none;margin-bottom:24px;flex:1}
.price-card li{padding:5px 0;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
.price-card li::before{content:'\2713';color:var(--green);font-weight:700;font-size:11px}
.price-card button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.2s}
.price-card.pop button{background:var(--accent);border-color:var(--accent)}
.price-card button:hover{transform:translateY(-1px)}

.s-about{padding:36px 32px}
.s-about h2{font-size:28px;font-weight:700;margin-bottom:16px;letter-spacing:-0.5px}
.s-about p{font-size:14.5px;color:var(--dim);line-height:1.75;margin-bottom:16px}
.stat-row{display:flex;gap:20px;margin-top:20px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-box .num{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat-box .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

.s-term{background:#0c0c0c;color:#00ff88;font-family:var(--mono);padding:12px;height:100%;overflow-y:auto;font-size:13px;line-height:1.5}
.t-line{margin-bottom:1px}
.t-prompt{color:#74b9ff}
.t-input-line{display:flex}
#t-input{background:transparent;border:none;color:#00ff88;font-family:var(--mono);font-size:13px;flex:1;outline:none}

.s-contact{padding:36px 32px}
.s-contact h2{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
.s-contact .sub{color:var(--dim);font-size:14px;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
.form-group input,.form-group textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border 0.2s;user-select:text}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}

@media(max-width:768px){
  #menubar{font-size:11px;padding:0 10px}
  .bar-r .hide-m{display:none}
  #dock{height:60px;padding:4px 8px;gap:4px}
  .d-item{width:44px;height:44px}
  .d-item .ico svg{width:22px;height:22px}
  .feat-grid{grid-template-columns:1fr}
  .price-row{flex-direction:column}
  .stat-row{flex-direction:column}
  .form-row{flex-direction:column}
}
</style>
</head>

  {id:"home",    name:"Home",     icon:"ico-home",    svg:I.rocket,  w:580,h:420,top:60,left:80},
  {id:"features",name:"Features", icon:"ico-feat",    svg:I.cubes,   w:620,h:480,top:80,left:160},

  {id:"contact", name:"Contact",  icon:"ico-contact", svg:I.mail,    w:480,h:460,top:75,left:180},
  {id:"_sep"},

];

var zIdx=100, wins={};

/* Build Dock */
var $dock=$("#dock");
sections.forEach(function(s){
  if(s.id==="_sep"){$dock.append('<div class="d-sep"></div>');return;}
  var inner=s.text?s.text:s.svg;
  var $el=$('<div class="d-item" id="d-'+s.id+'"><div class="ico '+s.icon+'">'+inner+'</div><div class="d-dot"></div><div class="d-tooltip">'+s.name+'</div></div>');
  $el.on("click",function(){openSection(s.id);});
  $dock.append($el);
});

/* Context Menu */
$(document).on("contextmenu","#desktop",function(e){
  if($(e.target).closest(".win,#dock,#menubar").length)return;
  e.preventDefault();
  $("#ctx").css({top:e.clientY,left:e.clientX}).fadeIn(80);
});
$(document).on("click",function(){$("#ctx").fadeOut(80);});
$("#ctx .ctx-i").on("click",function(){var a=$(this).data("app");if(a)openSection(a);});

/* Open Section */
function openSection(id){
  var s=sections.find(function(x){return x.id===id;});
  if(!s)return;
  if(s.external){window.open(s.external,"_blank");return;}
  var $d=$("#d-"+id);
  if(!$d.hasClass("open")&&!$d.hasClass("bouncing")){
    $d.addClass("bouncing");
    setTimeout(function(){$d.removeClass("bouncing").addClass("open");},600);
  }
  if(wins[id]){
    var $w=$("#w-"+id);
    if($w.is(":hidden"))$w.fadeIn(200);
    setActive(id);return;
  }
  createWin(id,s);
}

/* Create Window */
function createWin(id,s){
  wins[id]=s;
  var html='<div class="win opening" id="w-'+id+'" style="width:'+s.w+'px;height:'+s.h+'px;top:'+s.top+'px;left:'+s.left+'px;z-index:'+(++zIdx)+'">';
  html+='<div class="win-head"><div class="tl"><span class="c"></span><span class="m"></span><span class="x"></span></div><div class="win-title">'+s.name+'</div></div>';
  html+='<div class="win-body" id="wb-'+id+'"></div></div>';
  $("#wins").append(html);
  var $w=$("#w-"+id);
  $w.draggable({handle:".win-head",containment:"#desktop",start:function(){setActive(id);}})
    .resizable({minHeight:200,minWidth:300})
    .on("mousedown",function(){setActive(id);});
  $w.find(".c").on("click",function(e){e.stopPropagation();closeWin(id);});
  $w.find(".m").on("click",function(e){e.stopPropagation();$w.fadeOut(200);$("#app-name").text("Finder");});
  $w.find(".x").on("click",function(e){e.stopPropagation();maxWin(id);});
  setTimeout(function(){$w.removeClass("opening");},200);
  setActive(id);
  loadContent(id);
}

function setActive(id){
  $(".win").addClass("inactive");
  $("#w-"+id).removeClass("inactive").css("z-index",++zIdx);
  if(wins[id])$("#app-name").text(wins[id].name);
}
function closeWin(id){
  $("#w-"+id).fadeOut(150,function(){$(this).remove();});
  delete wins[id];$("#d-"+id).removeClass("open");$("#app-name").text("Finder");
}
function maxWin(id){
  var $w=$("#w-"+id);
  if($w.hasClass("maxed")){
    $w.css({top:$w.data("ot"),left:$w.data("ol"),width:$w.data("ow"),height:$w.data("oh")}).removeClass("maxed");
  }else{
    $w.data({ot:$w.css("top"),ol:$w.css("left"),ow:$w.css("width"),oh:$w.css("height")});
    $w.css({top:"28px",left:"0",width:"100%",height:"calc(100% - 90px)"}).addClass("maxed");
  }
}

/* Section Content */
function loadContent(id){
  var $b=$("#wb-"+id);
  switch(id){
    case "home":renderHome($b);break;
    case "features":renderFeatures($b);break;
    case "pricing":renderPricing($b);break;
    case "about":renderAbout($b);break;
    case "terminal":renderTerminal($b);break;
    case "contact":renderContact($b);break;
  }
}

function renderTerminal($c){
  $c.html(
    '<div class="s-term" id="t-out">'+
    '<div class="t-line" style="color:var(--dim)">Orbit CLI v0.8.2 \u2014 type "help" for commands</div><br>'+
    '<div id="t-hist"></div>'+
    '<div class="t-input-line"><span class="t-prompt">orbit ~ %&nbsp;</span><input type="text" id="t-input" autocomplete="off" autofocus></div>'+
    '</div>'
  );
  var $hist=$("#t-hist"),$inp=$("#t-input"),$out=$("#t-out");
  $c.on("click",function(){$inp.focus();});
  $inp.on("keydown",function(e){
    if(e.key!=="Enter")return;
    var cmd=this.value.trim();this.value="";
    $hist.append('<div class="t-line"><span class="t-prompt">orbit ~ %</span> '+cmd+'</div>');
    var r="";
    switch(cmd.split(" ")[0].toLowerCase()){
      case "help":r="Commands: help, status, deploy, whoami, clear, ping, fortune";break;
      case "clear":$hist.empty();$out.scrollTop($out[0].scrollHeight);return;
      case "status":r='<span style="color:#00ff88">\u25CF</span> All systems operational \u2014 99.97% uptime last 30d';break;
      case "deploy":r='Deploying to production... <span style="color:#00ff88">\u2713 Done</span> (just kidding, this is a demo)';break;
      case "whoami":r="A curious visitor exploring orbit.ai inside a fake macOS desktop. Meta, right?";break;
      case "ping":r="PONG \uD83C\uDFD3 (12ms from the edge node nearest you)";break;

      case "":return;
      default:r="zsh: command not found: "+cmd.split(" ")[0];
    }
    $hist.append('<div class="t-line">'+r+'</div>');
    $out.scrollTop($out[0].scrollHeight);
  });
}

/* Clock */
function tick(){
  var d=new Date();
  var ds=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  var ts=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
  $("#clock").text(ds+" "+ts);
}
setInterval(tick,1000);tick();
